apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: prod
  labels:
    app: payments-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: api
          image: registry.example.com/payments-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: "hunter2-super-secret"
            - name: LOG_LEVEL
              value: "info"
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
